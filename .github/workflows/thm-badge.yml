name: TryHackMe Badge

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download THM badge
        run: |
          mkdir -p assets
          curl -sL -o assets/thm_propic.png "https://tryhackme-badges.s3.amazonaws.com/Mrrob4t.png"
          if [ ! -s assets/thm_propic.png ]; then
            echo "Badge download failed"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./assets/thm_propic.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update THM badge [skip ci]"
          git push   
