name: TryHackMe Badge

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate badge screenshot
        run: |
          mkdir -p assets
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 800, height: 600 });
            await page.goto('https://tryhackme.com/p/Mrrob4t', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });
            await page.waitForSelector('.profile-stats, .stats, [class*=stat]', { timeout: 30000 }).catch(() => {});
            await new Promise(r => setTimeout(r, 3000));
            await page.screenshot({ path: 'assets/thm_propic.png', fullPage: false });
            await browser.close();
            console.log('Badge screenshot saved');
          })();
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./assets/thm_propic.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update THM badge [skip ci]"
          git push   
